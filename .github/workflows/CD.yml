
name: Deploy Garuda CBT

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gumukmas-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy via SCP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup PHP 8.3 on GitHub Runner
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, gd, zip, mysqli, calendar, fileinfo, iconv, intl, curl
          tools: composer:v2
          coverage: none

      # 3. Install Composer dependencies on GitHub
      - name: Install dependencies
        run: |
          set -euo pipefail

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress \
            --ignore-platform-req=php+

          test -f vendor/autoload.php

          echo "Dependencies installed successfully"

      # 4. Validate application
      - name: Validate application
        run: |
          php -l index.php
          test -d application
          test -d system
          test -d vendor
          test -f composer.lock

      # 5. Package complete application
      - name: Package application
        run: |
          set -euo pipefail

          tar -czf /tmp/gumukmas-release.tar.gz \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env*' \
            --exclude='./uploads' \
            --exclude='./backups' \
            --exclude='./application/logs' \
            --exclude='./application/cache' \
            .

          echo "Release package created"
          ls -lh /tmp/gumukmas-release.tar.gz

      # 6. Configure SSH
      - name: Configure SSH
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      # 7. Upload complete package via SCP
      - name: Upload via SCP
        run: |
          set -euo pipefail

          PORT="${SSH_PORT:-22}"
          ARCHIVE="gumukmas-${GITHUB_RUN_ID}.tar.gz"

          scp \
            -P "$PORT" \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/gumukmas-release.tar.gz \
            "${SSH_USER}@${SSH_HOST}:~/${ARCHIVE}"

          echo "SCP upload completed"

      # 8. Extract application on VPS
      - name: Deploy application
        run: |
          set -euo pipefail

          PORT="${SSH_PORT:-22}"
          ARCHIVE="gumukmas-${GITHUB_RUN_ID}.tar.gz"

          ssh \
            -p "$PORT" \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "bash -s -- '$ARCHIVE'" <<'REMOTE'

          set -euo pipefail

          APP_DIR="/var/www/gumukmas"
          ARCHIVE="$HOME/$1"

          trap 'rm -f "$ARCHIVE"' EXIT

          echo "Deploying Garuda CBT..."

          mkdir -p "$APP_DIR"

          # Preserve production configuration
          EXCLUDES=()

          if [ -f "$APP_DIR/application/config/database.php" ]; then
            EXCLUDES+=(--exclude='./application/config/database.php')
          fi

          if [ -f "$APP_DIR/application/config/config.php" ]; then
            EXCLUDES+=(--exclude='./application/config/config.php')
          fi

          # Extract prebuilt application, including vendor
          tar -xzf "$ARCHIVE" \
            -C "$APP_DIR" \
            "${EXCLUDES[@]}"

          # Create persistent runtime directories
          mkdir -p \
            "$APP_DIR/backups" \
            "$APP_DIR/application/logs" \
            "$APP_DIR/application/cache"

          for dir in \
            bank_soal file_siswa foto_siswa import \
            materi profiles settings temp tugas
          do
            mkdir -p "$APP_DIR/uploads/$dir"
          done

          # Verify deployed files
          test -f "$APP_DIR/index.php"
          test -f "$APP_DIR/vendor/autoload.php"

          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "Domain: gumukmas.congfandi.com"
          echo "PHP: 8.3"
          echo "Dependencies: Pre-installed"
          echo "================================"

          REMOTE
